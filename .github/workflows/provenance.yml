name: Public Artifact Provenance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  attest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Package public site
        run: tar -C . -czf /tmp/the-control-layer-public.tar.gz --exclude=.git .
      - name: Generate SHA-256
        run: sha256sum /tmp/the-control-layer-public.tar.gz > /tmp/the-control-layer-public.tar.gz.sha256
      - name: Verify release evidence hash
        run: cd /tmp && sha256sum -c the-control-layer-public.tar.gz.sha256
      - name: Attest public artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: /tmp/the-control-layer-public.tar.gz
      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-release-evidence
          path: |
            /tmp/the-control-layer-public.tar.gz
            /tmp/the-control-layer-public.tar.gz.sha256
          retention-days: 30
          if-no-files-found: error
          archive: true
          overwrite: false

  evidence-preflight:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Package public site
        run: tar -C . -czf /tmp/the-control-layer-public.tar.gz --exclude=.git .
      - name: Generate SHA-256
        run: sha256sum /tmp/the-control-layer-public.tar.gz > /tmp/the-control-layer-public.tar.gz.sha256
      - name: Verify preflight evidence hash
        run: cd /tmp && sha256sum -c the-control-layer-public.tar.gz.sha256
      - name: Upload preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-release-evidence-preflight
          path: |
            /tmp/the-control-layer-public.tar.gz
            /tmp/the-control-layer-public.tar.gz.sha256
          retention-days: 30
          if-no-files-found: error
          archive: true
          overwrite: false
