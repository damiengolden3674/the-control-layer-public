name: Public Artifact Provenance
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Package public site
        run: tar -czf the-control-layer-public.tar.gz --exclude=.git .
      - name: Generate SHA-256
        run: sha256sum the-control-layer-public.tar.gz > the-control-layer-public.tar.gz.sha256
      - name: Attest public artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: the-control-layer-public.tar.gz
      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-release-evidence
          path: |
            the-control-layer-public.tar.gz
            the-control-layer-public.tar.gz.sha256
          retention-days: 30
