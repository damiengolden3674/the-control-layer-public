name: Public Artifact Provenance
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Package public site
        run: tar -czf the-control-layer-public.tar.gz --exclude=.git .
      - name: Generate SHA-256
        run: sha256sum the-control-layer-public.tar.gz > the-control-layer-public.tar.gz.sha256
      - name: Attest public artifact
        uses: actions/attest@v4
        with:
          subject-path: the-control-layer-public.tar.gz
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-release-evidence
          path: |
            the-control-layer-public.tar.gz
            the-control-layer-public.tar.gz.sha256
          retention-days: 30
