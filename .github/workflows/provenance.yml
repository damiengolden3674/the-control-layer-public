name: Public Artifact Provenance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions: {}
jobs:
  attest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Package public site
        run: tar -C . -czf /tmp/the-control-layer-public.tar.gz --exclude=.git .
      - name: Generate SHA-256
        run: cd /tmp && sha256sum the-control-layer-public.tar.gz > the-control-layer-public.tar.gz.sha256
      - name: Verify release evidence hash
        run: cd /tmp && sha256sum -c the-control-layer-public.tar.gz.sha256
      - name: Attest public artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: /tmp/the-control-layer-public.tar.gz
      - name: Upload release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-release-evidence
          path: |
            /tmp/the-control-layer-public.tar.gz
            /tmp/the-control-layer-public.tar.gz.sha256
          retention-days: 30
          if-no-files-found: error
          overwrite: false

  evidence-preflight:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package public site
        run: tar -C . -czf /tmp/the-control-layer-public.tar.gz --exclude=.git .
      - name: Generate SHA-256
        run: cd /tmp && sha256sum the-control-layer-public.tar.gz > the-control-layer-public.tar.gz.sha256
      - name: Verify preflight evidence hash
        run: cd /tmp && sha256sum -c the-control-layer-public.tar.gz.sha256
      - name: Upload preflight evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-release-evidence-preflight
          path: |
            /tmp/the-control-layer-public.tar.gz
            /tmp/the-control-layer-public.tar.gz.sha256
          retention-days: 30
          if-no-files-found: error
          overwrite: false
