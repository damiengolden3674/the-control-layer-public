name: Security Baseline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  secret-pattern-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Scan public tree for secret/private markers
        run: |
          set -eu
          if grep -RInE 'Bearer |gho_|ghp_|github_pat_|192\.168\.|100\.[0-9]+\.[0-9]+\.[0-9]+|taild054a' --exclude-dir=.git .; then
            echo 'PUBLIC_SECURITY_SCAN=FAIL'
            exit 1
          fi
          echo 'PUBLIC_SECURITY_SCAN=PASS'
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: OpenSSF Scorecard
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard results
        uses: github/codeql-action/upload-sarif@87ef0dc97def48aa960fbf026a2563ee9dbdb470
        with:
          sarif_file: results.sarif
